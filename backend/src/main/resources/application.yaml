spring:
  application:
    name: community-visit-api

  datasource:
    url: jdbc:postgresql://localhost:5432/communityvisit
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

api:
  security:
    token:
      secret: ${JWT_SECRET:segredo-temporario-trocar-depois}